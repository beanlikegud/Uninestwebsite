<!DOCTYPE html>

<style>
:root{
  --bg:#f6f8f5; --card:#fff; --ink:#17231b; --muted:#68736c; --line:#dfe6df;
  --green:#1f7a4d; --green2:#e6f3eb; --lime:#b9d86b; --amber:#f5b942; --red:#d95757;
  --shadow:0 10px 35px rgba(23,35,27,.08); --radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#10251a;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:10}
.logo{font-size:25px;font-weight:800;padding:6px 10px 26px}.logo span{color:var(--lime)}
.role-switch{display:flex;background:#193322;border-radius:12px;padding:4px;margin:0 6px 18px}.role-switch button{flex:1;background:transparent;color:#b8c8bd;padding:9px;border-radius:9px}.role-switch button.active{background:#fff;color:#173321;font-weight:700}
.nav{display:grid;gap:5px}.nav button{background:transparent;color:#bdc9c1;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#1d3a28;color:#fff}.nav small{display:block;color:#6f8477;padding:15px 12px 5px;text-transform:uppercase;font-size:10px;letter-spacing:.12em}
.main{margin-left:250px;width:calc(100% - 250px);padding:26px 32px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.topbar h1{font-size:27px;margin:0}.top-actions{display:flex;gap:9px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#d8eadf;font-weight:800;color:var(--green)}
.btn{padding:10px 15px;border-radius:11px;font-weight:700}.btn.primary{background:var(--green);color:#fff}.btn.secondary{background:#e9f1eb;color:#245f40}.btn.ghost{background:#fff;border:1px solid var(--line);color:#405048}.btn.danger{background:#fdeaea;color:#a83c3c}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--green);font-weight:800}.price{font-size:25px;font-weight:800}.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#eef4ef;color:#276543;font-size:12px;font-weight:700}.tag.warn{background:#fff4dc;color:#9a6812}.tag.red{background:#fdeaea;color:#a83c3c}.tag.blue{background:#eaf1fb;color:#315f9c}
.stat{font-size:28px;font-weight:800;margin:4px 0}.stat-label{font-size:13px;color:var(--muted)}
.hero{background:linear-gradient(120deg,#e6f3eb,#f5f8df);border-radius:24px;padding:28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.hero h2{font-size:32px;max-width:650px;margin:6px 0 10px}.hero p{max-width:650px;color:#516057}
.search{display:flex;gap:9px;margin:18px 0}.search input,.search select,.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:10px;width:100%;outline:none}.search input{flex:1}
.room-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.room-card{overflow:hidden;padding:0}.room-card img{width:100%;height:170px;object-fit:cover}.room-body{padding:16px}.room-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.room-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.timeline{display:grid;gap:0}.step{display:grid;grid-template-columns:35px 1fr;gap:12px;position:relative;padding-bottom:22px}.step:not(:last-child):before{content:"";position:absolute;left:16px;top:34px;width:2px;height:calc(100% - 28px);background:#dce6df}.dot{width:33px;height:33px;border-radius:50%;background:#edf3ef;display:grid;place-items:center;font-weight:800;color:#6c7c72;z-index:1}.dot.done{background:#d8f0e1;color:var(--green)}.dot.current{background:var(--green);color:#fff}
.progress{height:9px;background:#edf1ee;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:999px}
.checks{display:grid;gap:10px}.check{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;align-items:center}.check input{width:18px;height:18px}
.verification-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.photos{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.photos img{width:100%;height:130px;object-fit:cover;border-radius:12px}.photos img:first-child{height:268px;grid-row:span 2}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.evidence div{border:1px solid var(--line);padding:13px;border-radius:12px}.icon{font-size:22px}
.notice{padding:13px 15px;border-radius:12px;background:#eef7f0;border-left:4px solid var(--green)}.notice.warn{background:#fff7e6;border-color:var(--amber)}.notice.red{background:#fff0f0;border-color:var(--red)}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:700}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#4e5d54}
.countdown{display:flex;gap:10px}.timebox{background:#11291b;color:#fff;border-radius:12px;padding:12px 15px;min-width:75px;text-align:center}.timebox strong{display:block;font-size:25px}.timebox span{font-size:10px;color:#b9c8be;text-transform:uppercase}
.kpi-line{display:flex;justify-content:space-between;margin:10px 0;font-size:13px}.bar{height:7px;background:#edf0ee;border-radius:99px}.bar span{display:block;height:100%;background:var(--green);border-radius:99px}
.toast{position:fixed;right:25px;bottom:25px;background:#11291b;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:50}
.modal{position:fixed;inset:0;background:rgba(10,20,13,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}.modal.open{display:flex}.modal-box{background:#fff;border-radius:20px;max-width:650px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr auto;gap:9px;margin:18px 0}.filters input,.filters select{border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:10px;width:100%;outline:none}.fav-btn{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px}.fav-btn.active{background:#fff1b8;border-color:#e3bf54}.pref-card{display:flex;align-items:center;justify-content:space-between;gap:15px}.big-calendar{margin-top:18px}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{margin-bottom:6px}.cal-head b{font-size:12px;color:var(--muted);padding:6px}.cal-day{min-height:92px;border:1px solid var(--line);border-radius:10px;background:#fafcf9;padding:8px}.cal-day.has-viewing{border-color:#7ca7d8;background:#f4f8fd}.cal-day.has-movein{border-color:#73b48e;background:#f2faf5}.cal-event{display:block;margin-top:7px;padding:5px;border-radius:7px;background:#eaf1fb;color:#315f9c;font-size:10px;line-height:1.25}.cal-event.move{background:#e6f3eb;color:#276543}.journey-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.journey-item{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.journey-item.active{border-color:var(--green);background:var(--green2)}
@media(max-width:1050px){.filters{grid-template-columns:1fr 1fr 1fr}.journey-strip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1050px){.room-grid{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.verification-grid{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{width:72px}.logo{font-size:0}.logo:after{content:"UN";font-size:20px}.nav span,.nav small,.role-switch{display:none}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.room-grid,.g2,.g3{grid-template-columns:1fr}.hero{display:block}.photos{grid-template-columns:1fr 1fr}.photos img:first-child{grid-column:span 2;grid-row:auto}.topbar h1{font-size:21px}}
</style>
</head>

function studentDashboard(){let next=viewingEvents.find(x=>x.status==='Confirmed');let nextRoom=next?rooms.find(r=>r.id===next.roomId):rooms[0];let checked=moveInRooms.map(x=>rooms.find(r=>r.id===x.roomId)).filter(Boolean);return `<div class="hero"><div><div class="eyebrow">My rental overview</div><h2>Everything about your room search, in one place.</h2><p>See what you saved, what you are viewing, which room is under contract, and which move-in checks are already completed.</p><div class="actions"><button class="btn primary" onclick="setPage('search')">Find matching rooms →</button><button class="btn ghost" onclick="setPage('bookings')">View all viewing bookings</button></div></div><div style="font-size:64px">🗓️</div></div><div class="grid g4">${[['Saved rooms',favorites.length,'shortlisted'],['Viewings',viewingEvents.length,'booked / requested'],['Move-in checked',moveInRooms.length,'completed'],['Current contract',contractRoomId?'1':'0','room']].map(x=>`<div class="card"><div class="stat">${x[1]}</div><div class="stat-label">${x[0]} · ${x[2]}</div></div>`).join('')}</div><div style="height:18px"></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">Your rental calendar</div><h3>Viewing & move-in calendar</h3><p class="muted small">Viewing dates and completed move-in checks are marked here so you can see exactly where you are in the journey.</p></div><span class="tag blue">October 2026</span></div>${rentalCalendar()}<div class="actions"><button class="btn ghost" onclick="setPage('bookings')">Manage viewing bookings</button><button class="btn secondary" onclick="setPage('movein')">Open move-in check</button></div></div><div style="height:18px"></div><div class="grid g2"><div class="card"><div class="eyebrow">Current status</div><h3>${nextRoom.title}</h3><div class="timeline">${[['1','Saved / discovered',favorites.includes(nextRoom.id)?'done':''],['2','Viewing',viewingEvents.some(x=>x.roomId===nextRoom.id)?'done':'current'],['3','Contract',contractRoomId===nextRoom.id?'done':''],['4','Protected deposit',contractRoomId===nextRoom.id?'current':''],['5','Move-in check',moveInRooms.some(x=>x.roomId===nextRoom.id)?'done':'']].map(x=>`<div class="step"><div class="dot ${x[2]}">${x[0]}</div><div><b>${x[1]}</b><div class="small muted">${x[2]==='done'?'Completed':x[2]==='current'?'Next action':'Upcoming'}</div></div></div>`).join('')}</div></div><div class="card"><div class="eyebrow">Your saved & active rooms</div><div class="checks">${favorites.slice(0,4).map(id=>{let r=rooms.find(x=>x.id===id);return r?`<div class="check" style="justify-content:space-between"><div><b>${r.title}</b><div class="small muted">${r.area} · ${money(r.rent)}</div></div><span class="tag ${viewingEvents.some(v=>v.roomId===r.id)?'blue':''}">${viewingEvents.some(v=>v.roomId===r.id)?'Viewing':'Saved'}</span></div>`:''}).join('')}</div><button class="btn ghost" style="margin-top:14px" onclick="setPage('favorites')">Open favorites</button></div></div><div style="height:18px"></div><div class="card"><h3>Rooms you are likely to like</h3><p class="muted small">Based on your preferred areas, budget and room type.</p><div class="room-grid" style="margin-top:14px">${roomCards(rooms.filter(r=>preferences.areas.includes(r.area)).slice(0,3))}</div></div>`}

function rentalCalendar(){let days=Array.from({length:31},(_,i)=>i+1);return `<div class="big-calendar"><div class="cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<b>${d}</b>`).join('')}</div><div class="cal-grid">${days.map(d=>{let date=`2026-10-${String(d).padStart(2,'0')}`;let ev=viewingEvents.find(x=>x.date===date);let mi=moveInRooms.find(x=>x.date===date);let room=ev?rooms.find(r=>r.id===ev.roomId):mi?rooms.find(r=>r.id===mi.roomId):null;return `<div class="cal-day ${ev?'has-viewing':''} ${mi?'has-movein':''}"><b>${d}</b>${ev?`<span class="cal-event">📅 Viewing<br>${room.title}</span>`:''}${mi?`<span class="cal-event move">📸 Move-in check<br>${room.title}</span>`:''}</div>`}).join('')}</div><div class="small muted" style="margin-top:12px">📅 Viewing · 📸 Move-in check · Click a date in the Viewing page for full details.</div></div>`}
function studentTimeline(){let a=[['1','Search','done'],['2','Verify','done'],['3','Viewing','done'],['4','Contract','done'],['5','Protected deposit','current'],['6','Move-in check',''],['7','Deposit release','']];return `<div class="timeline">${a.map(x=>`<div class="step"><div class="dot ${x[2]}">${x[0]}</div><div><b>${x[1]}</b><div class="small muted">${x[2]==='current'?'Action needed':'Completed / upcoming'}</div></div></div>`).join('')}</div>`}

function searchView(){return `<div class="card"><div class="eyebrow">Discovery</div><h2>Find a room using more than just campus</h2><p class="muted">Choose district, price range, room size and distance. UniNest currently focuses on Cau Giay, Dong Da and Hai Ba Trung.</p><div class="filters"><input placeholder="Area, street or landmark…" id="q" oninput="filterRooms()"><select id="areaFilter" onchange="filterRooms()"><option value="">All districts</option><option>Cau Giay</option><option>Dong Da</option><option>Hai Ba Trung</option></select><select id="budgetFilter" onchange="filterRooms()"><option value="">Any price</option><option value="under3">Under 3m</option><option value="3to5">3–5m</option><option value="over5">&gt;5m</option></select><select id="bedFilter" onchange="filterRooms()"><option value="">Any bedroom</option><option value="1">1 bedroom</option><option value="2">2 bedrooms</option></select><select id="distanceFilter" onchange="filterRooms()"><option value="0">Any distance</option><option value="1">≤ 1 km</option><option value="2">≤ 2 km</option><option value="3">≤ 3 km</option></select><button class="btn primary" onclick="filterRooms()">Apply</button></div><div class="small muted">Quick filters: <button class="btn ghost" style="padding:5px 8px" onclick="quickFilter('3to5')">3–5m</button> <button class="btn ghost" style="padding:5px 8px" onclick="quickFilter('over5')">&gt;5m</button> <button class="btn ghost" style="padding:5px 8px" onclick="quickBeds('1')">1 bedroom</button> <button class="btn ghost" style="padding:5px 8px" onclick="quickBeds('2')">2 bedrooms</button></div><div id="roomGrid" class="room-grid" style="margin-top:16px">${roomCards(rooms)}</div></div>`}
function isFav(id){return favorites.includes(id)}
function toggleFavorite(id){if(isFav(id)){favorites=favorites.filter(x=>x!==id);showToast('Removed from favorites')}else{favorites.push(id);showToast('Added to favorites ⭐')}render()}
function roomCards(arr){return arr.map(r=>`<div class="card room-card"><img src="${r.img}" alt="room"><div class="room-body"><div style="display:flex;justify-content:space-between;gap:8px"><b>${r.title}</b><button class="fav-btn ${isFav(r.id)?'active':''}" title="Add to favorites" onclick="event.stopPropagation();toggleFavorite(${r.id})">${isFav(r.id)?'★':'☆'}</button></div><div class="small muted" style="margin-top:6px">${r.area} · ${r.distance} to campus</div><div class="room-meta"><span class="tag">${r.size}</span><span class="tag">${r.beds}</span><span class="tag">${r.rent<=5000000?'3–5m':' >5m'}</span><span class="tag blue">Owner verified</span></div><div class="small muted">Monthly total estimate</div><div class="price">${money(r.total)}</div><div class="small muted">Rent ${money(r.rent)} + utilities & services</div><div class="room-footer"><button class="btn ghost" onclick="showRoom(${r.id})">View evidence</button><button class="btn primary" onclick="bookRoom(${r.id})">Book viewing</button></div></div></div>`).join('')}
function filterRooms(){let q=(document.getElementById('q')?.value||'').toLowerCase();let area=document.getElementById('areaFilter')?.value||'';let budget=document.getElementById('budgetFilter')?.value||'';let dist=Number(document.getElementById('distanceFilter')?.value||0);let bed=document.getElementById('bedFilter')?.value||'';let arr=rooms.filter(r=>{let text=(r.title+' '+r.area+' '+r.owner).toLowerCase();let budgetOK=!budget||(budget==='under3'&&r.rent<3000000)||(budget==='3to5'&&r.rent>=3000000&&r.rent<=5000000)||(budget==='over5'&&r.rent>5000000);let bedOK=!bed||r.beds.startsWith(bed+' ');return text.includes(q)&&(!area||r.area===area)&&budgetOK&&(!dist||parseFloat(r.distance)<=dist)&&bedOK});document.getElementById('roomGrid').innerHTML=arr.length?roomCards(arr):`<div class="empty" style="grid-column:1/-1">No verified rooms match these filters.<br><button class="btn ghost" style="margin-top:12px" onclick="setPage('search')">Reset filters</button></div>`}function quickFilter(v){document.getElementById('budgetFilter').value=v;filterRooms()}function quickBeds(v){document.getElementById('bedFilter').value=v;filterRooms()}
function favoritesView(){let arr=rooms.filter(r=>favorites.includes(r.id));return `<div class="card"><div class="eyebrow">Share & decide</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2>Your saved rooms</h2><p class="muted">Keep shortlisted rooms here while you compare them with your parents or friends.</p></div><button class="btn secondary" onclick="openModal(shareSummaryModal())">🔗 Share shortlist</button></div>${arr.length?`<div class="room-grid" style="margin-top:16px">${roomCards(arr)}</div>`:`<div class="empty">You haven't saved a room yet.<br><button class="btn primary" style="margin-top:12px" onclick="setPage('search')">Browse verified rooms</button></div>`}</div>`}
function shareSummaryModal(){return `<h2>Shareable room summary</h2><p class="muted">Parents can open this summary without logging in.</p><div class="card" style="box-shadow:none"><b>${selectedRoom.title}</b><div class="small muted">${selectedRoom.area} · ${selectedRoom.distance} from campus</div><div class="price" style="margin-top:8px">${money(selectedRoom.total)}/month estimated</div><div class="room-meta"><span class="tag">✓ Owner verified</span><span class="tag">✓ Address checked</span><span class="tag">✓ Utility tariff checked</span></div></div><button class="btn primary" onclick="closeModal();showToast('Share link copied')">Copy share link</button>`}
function profileView(){return `<div class="grid g2"><div class="card"><div class="eyebrow">Personalization</div><h2>What are you looking for?</h2><p class="muted">These preferences power your recommendations and make search faster.</p><div class="field"><label>Preferred areas</label><input value="Cau Giay, Dong Da, Hai Ba Trung" onchange="preferences.areas=this.value.split(',').map(x=>x.trim())"></div><div class="field"><label>Maximum monthly budget</label><select onchange="preferences.maxBudget=Number(this.value)"><option value="3000000">3,000,000 ₫</option><option value="3500000" selected>3,500,000 ₫</option><option value="4000000">4,000,000 ₫</option></select></div><div class="field"><label>Maximum distance from campus</label><select onchange="preferences.maxDistance=Number(this.value)"><option value="1">1 km</option><option value="2" selected>2 km</option><option value="5">5 km</option></select></div><div class="field"><label>Room type</label><select><option>Studio / private</option><option>Shared apartment</option></select></div><button class="btn primary" onclick="showToast('Preferences saved — recommendations updated');setPage('dashboard')">Save preferences</button></div><div class="card"><h3>Your preference snapshot</h3><div class="pref-card"><span>📍 Areas</span><b>Cau Giay · Dong Da · Hai Ba Trung</b></div><div class="pref-card" style="margin-top:12px"><span>💰 Budget</span><b>≤ 3.5m</b></div><div class="pref-card" style="margin-top:12px"><span>📏 Distance</span><b>≤ 2 km</b></div><div class="pref-card" style="margin-top:12px"><span>🏠 Type</span><b>Private / studio</b></div><div class="notice" style="margin-top:18px">Your saved rooms also influence recommendations — that's why the dashboard gets smarter over time.</div></div></div>`}
function showRoom(id){selectedRoom=rooms.find(x=>x.id===id)||rooms[0];openModal(`<div style="display:flex;justify-content:space-between"><div><span class="tag">✓ Verified</span><h2 style="margin:10px 0">${selectedRoom.title}</h2><div class="muted">${selectedRoom.area} · ${selectedRoom.distance} from campus</div></div><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="photos" style="margin-top:15px">${selectedRoom.photos.map(x=>`<img src="${x}">`).join('')}</div><h3 style="margin-top:18px">Verification evidence</h3><div class="evidence"><div>🪪 <b>Owner identity</b><br><span class="small muted">Checked against submitted ID</span></div><div>🏠 <b>Room existence</b><br><span class="small muted">Video check completed</span></div><div>📍 <b>Location</b><br><span class="small muted">Address + map location checked</span></div><div>⚡ <b>Electricity</b><br><span class="small muted">${selectedRoom.electricity.toLocaleString()} ₫/kWh · tariff checked</span></div></div><div class="notice" style="margin-top:14px">Parents can open this evidence summary without logging in.</div><div class="actions"><button class="btn primary" onclick="closeModal();bookRoom(${selectedRoom.id})">Book viewing</button></div>`)}
function bookRoom(id){selectedRoom=rooms.find(x=>x.id===id)||rooms[0];if(!viewingEvents.some(v=>v.roomId===id)){viewingEvents.push({date:'2026-10-18',roomId:id,time:'18:30',status:'Pending'});}setPage('bookings');showToast('Viewing request created — owner confirmation pending')}
function bookingsView(){return `<div class="card"><div class="eyebrow">Viewing stage</div><h2>Your viewing bookings</h2><p class="muted">Every room you book appears here. Once you finish a viewing, you can move directly to its contract.</p>${viewingEvents.map(v=>{let r=rooms.find(x=>x.id===v.roomId);return `<div class="check" style="margin:10px 0;display:grid;grid-template-columns:1.4fr 1fr auto;align-items:center"><div><b>${r.title}</b><div class="small muted">${r.area} · ${v.date} · ${v.time}</div></div><span class="tag ${v.status==='Confirmed'?'blue':'warn'}">${v.status}</span><div class="actions" style="margin:0"><button class="btn ghost" onclick="showRoom(${r.id})">View room</button><button class="btn primary" onclick="contractRoomId=${r.id};selectedRoom=rooms.find(x=>x.id===${r.id});setPage('contract')">→ Contract</button></div></div>`}).join('')}</div><div style="height:18px"></div><div class="card"><div class="eyebrow">Calendar</div><h3>Your viewing schedule</h3>${rentalCalendar()}</div>`}
function contractView(){let r=rooms.find(x=>x.id===contractRoomId)||rooms[0];let depositAmount=Math.round(r.rent*1.7);return `<div class="grid g2"><div class="card"><span class="tag">Ready to sign</span><h2>UniNest e-Contract</h2><p class="muted">${r.title} · ${r.owner} · ${r.area}</p><div class="notice">This contract was reached from your viewing. It carries the verified room information into the payment and move-in stages.</div><div class="checks" style="margin-top:15px">${[`Rent: ${money(r.rent)}/month`,`Electricity: ${money(r.electricity)}/kWh`,`Water: ${money(r.water)}/person`,`Estimated monthly total: ${money(r.total)}`,`Deposit: ${money(depositAmount)}`,'Deposit release: after move-in check'].map(x=>`<div class="check">✓ ${x}</div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="showToast('Contract signed successfully');setPage('deposit')">Sign contract → Protected deposit</button><button class="btn ghost" onclick="showToast('Contract PDF preview')">Preview PDF</button></div></div><div class="card"><h3>Protection rules</h3><div class="timeline">${[['01','Viewing completed','done'],['02','Contract signed','current'],['03','Deposit enters escrow',''],['04','Move-in report recorded',''],['05','Release after confirmation','']].map(x=>`<div class="step"><div class="dot ${x[2]}">${x[0]}</div><div><b>${x[1]}</b><div class="small muted">${x[2]==='done'?'Completed':x[2]==='current'?'Next action':'Upcoming'}</div></div></div>`).join('')}</div></div></div>`}
function depositView(){return `<div class="hero"><div><div class="eyebrow">Protected deposit</div><h2>Your deposit is held safely until move-in.</h2><p>Instead of sending 5–6m VND directly to an unknown person, the deposit stays in the protected transaction flow. Release is linked to the move-in evidence.</p><div class="actions"><button class="btn primary" onclick="showToast('QR payment screen opened — MoMo / VNPay')">Pay protected deposit via QR</button><button class="btn ghost" onclick="setPage('movein')">Go to move-in check →</button></div></div><div style="font-size:72px">🔐</div></div><div class="grid g3"><div class="card"><div class="eyebrow">Held amount</div><div class="stat">${money(deposit)}</div><div class="stat-label">Protected deposit</div></div><div class="card"><div class="eyebrow">Release trigger</div><div class="stat">Move-in</div><div class="stat-label">Both sides confirm room condition</div></div><div class="card"><div class="eyebrow">Dispute</div><div class="stat">Protected</div><div class="stat-label">Raise issue before release</div></div></div><div style="height:18px"></div><div class="card"><h3>Deposit flow</h3>${studentTimeline()}<div class="notice warn">⚠ Never pay a deposit to a landlord's personal account if the transaction is shown as protected on UniNest.</div></div>`}
function moveinView(){return `<div class="grid g2"><div class="card"><span class="tag">Move-in day</span><h2>Record the room before accepting it</h2><p class="muted">Take photos together with the landlord. These become the baseline for future move-out disputes.</p><div class="photos"><img src="${selectedRoom.photos[0]}"><img src="${selectedRoom.photos[1]}"><img src="${selectedRoom.photos[2]}"></div><div class="actions"><button class="btn ghost" onclick="showToast('Camera upload opened')">📷 Add room photos</button><button class="btn secondary" onclick="showToast('Video timestamp recorded')">🎥 Record video</button></div></div><div class="card"><h3>Move-in checklist</h3><div class="checks" id="moveChecks">${['Room condition matches listing','Furniture & appliances received','Meter reading recorded','Keys received','House rules reviewed','Both sides confirm handover'].map((x,i)=>`<label class="check"><input type="checkbox" onchange="checkMove()"> <span>${x}</span></label>`).join('')}</div><div style="margin-top:15px"><div class="progress"><span id="moveProgress" style="width:0%"></span></div><div class="small muted" id="moveText" style="margin-top:6px">0/6 confirmed</div></div></div></div><div style="height:18px"></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:start;gap:15px"><div><span class="tag warn">Deposit release window</span><h3 style="margin-top:8px">Countdown to landlord payout</h3><p class="small muted">After both sides submit the move-in report, the protected deposit is queued for release.</p></div><div class="countdown"><div class="timebox"><strong id="hh">22</strong><span>hours</span></div><div class="timebox"><strong id="mm">00</strong><span>minutes</span></div><div class="timebox"><strong id="ss">00</strong><span>seconds</span></div></div></div><div class="actions"><button class="btn primary" onclick="releaseDeposit()">Confirm move-in & start release</button><button class="btn danger" onclick="showToast('Dispute opened — deposit remains protected')">Raise a dispute</button></div></div>`}
function checkMove(){let n=[...document.querySelectorAll('#moveChecks input')].filter(x=>x.checked).length;document.getElementById('moveProgress').style.width=(n/6*100)+'%';document.getElementById('moveText').textContent=`${n}/6 confirmed`}
function releaseDeposit(){timerEnd=Date.now()+22*60*60*1000;showToast('Move-in confirmed. Deposit release countdown started.');}
function startTimer(){clearInterval(window._timer);window._timer=setInterval(()=>{let d=Math.max(0,timerEnd-Date.now());let h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000),s=Math.floor(d%60000/1000);['hh','mm','ss'].forEach((id,i)=>{let v=[h,m,s][i];let el=document.getElementById(id);if(el)el.textContent=String(v).padStart(2,'0')});},1000)}
function reviewsView(){return `<div class="grid g2"><div class="card"><h2>How was your rental?</h2><div style="font-size:38px;margin:15px 0">☆ ☆ ☆ ☆ ☆</div><div class="field"><label>Comment</label><textarea rows="5" placeholder="Was the room accurate? Was the landlord responsive?"></textarea></div><button class="btn primary" onclick="showToast('Review submitted')">Submit review</button></div><div class="card"><h3>Need help after move-in?</h3><div class="checks"><div class="check">💬 Chat with UniNest support</div><div class="check">⚡ Report utility mismatch</div><div class="check">🧾 Report contract issue</div><div class="check">🔐 Start a deposit dispute</div></div></div></div>`}

function landlordDashboard(){return `<div class="hero"><div><div class="eyebrow">Landlord command center</div><h2>From first owner contact to successful move-in — all in one place.</h2><p>Track verification, property completeness, pre-screened leads, viewing confirmations, protected deposits, payout and relisting.</p><div class="actions"><button class="btn primary" onclick="setPage('listings')">Manage properties</button><button class="btn ghost" onclick="showToast('Owner referral link copied')">🔗 Copy owner referral link</button></div></div><div style="font-size:80px">🏠</div></div><div class="journey-strip">${[['1','Awareness','Referral / field team'],['2','Register','Owner verification'],['3','Profile','Costs & rules'],['4','Leads','Pre-screened students'],['5','Deposit','Contract + escrow'],['6','Move-in','Payout + fee'],['7','Relist','Peak-season reminder']].map((x,i)=>`<div class="journey-item ${i===3?'active':''}"><b>${x[0]}. ${x[1]}</b><div class="small muted" style="margin-top:5px">${x[2]}</div></div>`).join('')}</div><div style="height:18px"></div><div class="grid g4">${[['Occupancy','90%','9/10 rooms filled'],['New leads','8','pre-screened'],['Viewing no-show','8%','target <10%'],['Success fee','0 ₫','until move-in']].map(x=>`<div class="card"><div class="stat">${x[1]}</div><div class="stat-label">${x[0]}</div><div class="small muted">${x[2]}</div></div>`).join('')}</div><div style="height:18px"></div><div class="grid g2"><div class="card"><div class="eyebrow">Registration & verification</div><h3>Finish onboarding</h3><div class="checks"><div class="check">✓ Owner identity submitted</div><div class="check">✓ Video appointment accepted</div><div class="check">✓ Property address checked</div><div class="check">⚠ Upload latest electricity bill</div></div><button class="btn primary" style="margin-top:14px" onclick="setPage('verification')">Open verification</button></div><div class="card"><div class="eyebrow">Property profile</div><h3>Listing completeness</h3><div class="kpi-line"><span>Cost fields complete</span><b>92%</b></div><div class="progress"><span style="width:92%"></span></div><div class="kpi-line"><span>Tariff check passed</span><b>9/10</b></div><div class="progress"><span style="width:90%"></span></div><div class="kpi-line"><span>House rules published</span><b>10/10</b></div><div class="progress"><span style="width:100%"></span></div><button class="btn ghost" style="margin-top:14px" onclick="setPage('listings')">Complete profiles</button></div></div><div style="height:18px"></div><div class="grid g2"><div class="card"><h3>Today's actions</h3><table class="table"><tr><td>Confirm Minh Anh viewing</td><td><button class="btn primary" onclick="showToast('Viewing confirmed')">Confirm</button></td></tr><tr><td>Review protected deposit</td><td><button class="btn ghost" onclick="setPage('ldeposit')">Open</button></td></tr><tr><td>Review move-in report</td><td><button class="btn secondary" onclick="setPage('lmovein')">Review</button></td></tr></table></div><div class="card"><h3>Retention & relisting</h3><p class="muted small">Tenants may stay a year or less. Prepare vacancies before February and July/August peaks.</p><div class="notice">Next reminder: <b>15 Jan 2027</b> · 6 of 9 rooms already prepared.</div><button class="btn primary" style="margin-top:14px" onclick="setPage('relist')">Open relist planner</button></div></div>`}
function listingsView(){return `<div class="actions" style="justify-content:space-between"><div><span class="tag">9 active rooms</span> <span class="tag warn">1 vacancy</span></div><button class="btn primary" onclick="openModal(addListingModal())">+ Add property</button></div><div style="height:18px"></div><div class="grid g2">${[['Cau Giay — 10 rooms','9 occupied','Verified','3.2m–3.8m'],['Dong Da — 6 rooms','5 occupied','Verification due','2.5m–3.1m']].map((x,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><h3>${x[0]}</h3><div class="muted">${x[1]}</div></div><span class="tag ${i?'warn':''}">${x[2]}</span></div><div class="room-meta"><span class="tag">📍 Hanoi</span><span class="tag">⚡ Tariff checked</span><span class="tag">📄 e-contract</span></div><div class="small muted">Average rent</div><div class="price">${x[3]}</div><div class="actions"><button class="btn ghost" onclick="setPage('verification')">View verification</button><button class="btn primary" onclick="setPage('leads')">View leads</button></div></div>`).join('')}</div>`}
function addListingModal(){return `<h2>Add a property</h2><p class="muted">The listing template forces the information students need before contacting you.</p><div class="field"><label>Property name</label><input placeholder="Cau Giay 10-room house"></div><div class="grid g2"><div class="field"><label>Rent / month</label><input value="3200000"></div><div class="field"><label>Electricity / kWh</label><input value="3460"></div><div class="field"><label>Water / person</label><input value="30000"></div><div class="field"><label>Parking</label><input value="80000"></div></div><div class="field"><label>House rules</label><textarea rows="3" placeholder="Curfew, pets, guests..."></textarea></div><button class="btn primary" onclick="closeModal();showToast('Property saved — verification requested')">Save & request verification</button>`}
function landlordVerification(){return `<div class="verification-grid"><div class="card"><span class="tag">Verified owner</span><h2>Property verification</h2><p class="muted">Students need to see evidence, not just a badge. Upload the actual room and document evidence.</p><div class="photos"><img src="${selectedRoom.photos[0]}"><img src="${selectedRoom.photos[1]}"><img src="${selectedRoom.photos[2]}"></div><div class="actions"><button class="btn primary" onclick="showToast('Camera/video verification started')">🎥 Start video verification</button><button class="btn ghost" onclick="showToast('Document upload opened')">🪪 Upload ID / ownership</button></div></div><div class="card"><h3>Verification checklist</h3><div class="checks">${[['Owner identity','Passed'],['Property address','Passed'],['Room existence','Passed'],['Room condition','Passed'],['Electricity tariff','Passed'],['Video consent','Accepted']].map(x=>`<div class="check">✓ <div><b>${x[0]}</b><div class="small muted">${x[1]}</div></div></div>`).join('')}</div><div class="notice" style="margin-top:14px">Your verification evidence is shown on the student room page. You can choose what is public.</div></div></div>`}
function leadsView(){return `<div class="card"><div style="display:flex;justify-content:space-between"><div><h3>Pre-screened student leads</h3><p class="muted small">Students already saw rent, total cost and house rules.</p></div><span class="tag">8 new</span></div><table class="table"><tr><th>Student</th><th>Budget</th><th>Move-in</th><th>Viewing</th><th>Action</th></tr>${[['Minh Anh','2.5–3m','01 Nov','Tomorrow 18:30'],['Quang Minh','3–3.5m','05 Nov','Thu 17:30'],['Lan Chi','2.5–3m','01 Nov','Fri 19:00'],['Hoang Nam','3–4m','10 Nov','Sat 10:00']].map(x=>`<tr><td><b>${x[0]}</b><div class="small muted">Profile completed</div></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="tag">${x[3]}</span></td><td><button class="btn primary" onclick="showToast('Viewing confirmed for ${x[0]}')">Confirm</button></td></tr>`).join('')}</table></div>`}
function calendarView(){return `<div class="grid g3"><div class="card"><div class="eyebrow">Today</div><div class="stat">3</div><div class="stat-label">viewings</div></div><div class="card"><div class="eyebrow">This week</div><div class="stat">11</div><div class="stat-label">booked slots</div></div><div class="card"><div class="eyebrow">No-show</div><div class="stat">8%</div><div class="stat-label">after pre-screening</div></div></div><div style="height:18px"></div><div class="card"><h3>Viewing calendar</h3><table class="table">${['Tomorrow 18:30 — Minh Anh — Room 204','Thu 17:30 — Quang Minh — Room 307','Fri 19:00 — Lan Chi — Room 105','Sat 10:00 — Hoang Nam — Room 301'].map((x,i)=>`<tr><td>📅</td><td>${x}</td><td><span class="tag ${i===0?'':'blue'}">${i===0?'Confirmed':'Pending'}</span></td><td><button class="btn ghost" onclick="showToast('Calendar event updated')">Manage</button></td></tr>`).join('')}</table></div>`}
function landlordDeposit(){return `<div class="grid g2"><div class="card"><span class="tag">Protected</span><h2>Deposit: ${money(deposit)}</h2><p class="muted">Tenant: Minh Anh · Sunny Studio · Contract signed.</p><div class="notice">The deposit is protected until the move-in report is completed. You do not need to chase the student for payment.</div><div class="actions"><button class="btn ghost" onclick="showToast('Contract opened')">View contract</button><button class="btn danger" onclick="showToast('Dispute process opened')">Report issue</button></div></div><div class="card"><h3>Transaction milestones</h3>${[['Contract signed','done'],['Deposit received into protected flow','done'],['Move-in report','current'],['Release countdown',''],['Payout to landlord','']].map((x,i)=>`<div class="step"><div class="dot ${x[1]}">${i+1}</div><div><b>${x[0]}</b><div class="small muted">${x[1]?'Completed':'Waiting'}</div></div></div>`).join('')}</div></div>`}
function landlordMovein(){return `<div class="grid g2"><div class="card"><h3>Student move-in report</h3><div class="photos"><img src="${selectedRoom.photos[0]}"><img src="${selectedRoom.photos[1]}"><img src="${selectedRoom.photos[2]}"></div><div class="checks" style="margin-top:14px">${['Room condition accepted','Furniture received','Meter reading recorded','Keys handed over','House rules acknowledged','Tenant confirmation'].map(x=>`<div class="check">✓ ${x}</div>`).join('')}</div></div><div class="card"><span class="tag warn">Release pending</span><h3 style="margin-top:10px">Deposit release countdown</h3><p class="muted">Once you confirm the handover, the protected deposit moves to the payout queue.</p><div class="countdown"><div class="timebox"><strong id="hh">22</strong><span>hours</span></div><div class="timebox"><strong id="mm">00</strong><span>minutes</span></div><div class="timebox"><strong id="ss">00</strong><span>seconds</span></div></div><div class="notice" style="margin-top:15px">Success fee is also triggered only after successful move-in.</div><div class="actions"><button class="btn primary" onclick="showToast('Handover confirmed — payout countdown active')">Confirm move-in</button><button class="btn danger" onclick="showToast('Issue reported — payout paused')">Dispute</button></div></div></div>`}
function earningsView(){return `<div class="grid g3">${[['Gross rent generated','24.8m'],['UniNest success fee','0.48m'],['Net after fee','24.32m']].map(x=>`<div class="card"><div class="stat">${x[1]} ₫</div><div class="stat-label">${x[0]}</div></div>`).join('')}</div><div style="height:18px"></div><div class="card"><h3>Why the fee is different from a broker</h3><div class="notice">UniNest charges around 15–20% of one month's rent only when the tenant actually moves in. No upfront brokerage fee.</div><table class="table" style="margin-top:12px"><tr><th>Rental</th><th>Rent</th><th>Fee</th><th>Status</th></tr><tr><td>Room 204</td><td>3.2m</td><td>480k</td><td><span class="tag">Triggered at move-in</span></td></tr><tr><td>Room 307</td><td>2.8m</td><td>—</td><td><span class="tag warn">Not yet rented</span></td></tr></table></div>`}
function relistView(){return `<div class="grid g2"><div class="card"><h3>Peak-season vacancy planner</h3><p class="muted">Prepare February and July/August listings early instead of waiting for rooms to become empty.</p><div class="kpi-line"><span>Next peak</span><b>Feb 2027</b></div><div class="progress"><span style="width:68%"></span></div><div class="small muted" style="margin-top:6px">6/9 rooms already prepared</div><div class="actions"><button class="btn primary" onclick="showToast('Early-listing reminder scheduled')">Schedule reminder</button></div></div><div class="card"><h3>Occupancy</h3>${[['Room 101','Occupied','100%'],['Room 102','Occupied','100%'],['Room 103','Occupied','100%'],['Room 104','Vacant','0%'],['Room 105','Occupied','100%']].map(x=>`<div class="kpi-line"><span>${x[0]}</span><span class="tag ${x[1]==='Vacant'?'warn':''}">${x[1]}</span></div>`).join('')}</div></div><div style="height:18px"></div><div class="card"><h3>Relisting checklist</h3><div class="checks">${['Update room photos','Confirm rent & utility rates','Refresh house rules','Open viewing slots','Publish to student audience'].map(x=>`<div class="check"><input type="checkbox"> ${x}</div>`).join('')}</div></div>`}

render();
</script>
